[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiaomi-history"
version = "0.1.0"
description = "C700 Xiaomi Home history recording protocol research CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
xiaomi-history = "xiaomi_history.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xiaomi_history"]

